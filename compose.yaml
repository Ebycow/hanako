services:
  hanako:
    build: .
    image: hanako
    restart: unless-stopped
    # ffmpeg の子プロセスを回収し、停止時の SIGTERM を確実に届ける
    init: true
    # Discord に接続している間はハートビートファイルが 30 秒ごとに更新される。90 秒更新がなければ異常とみなす
    # 外部監視 (Better Stack) へのハートビートもこれを見る
    healthcheck:
      test: ["CMD", "node", "-e", "try { process.exit(Date.now() - require('fs').statSync('/tmp/hanako-heartbeat').mtimeMs < 90000 ? 0 : 1) } catch { process.exit(1) }"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 60s
      start_interval: 5s
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?.env に DISCORD_BOT_TOKEN を設定してください}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?.env に DISCORD_CLIENT_ID を設定してください}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      EBYROID_STREAM_API_URL: ${EBYROID_STREAM_API_URL:-http://host.docker.internal:4090/api/v1/audiostream}
      EBYROID_STREAM_API_MODE: ${EBYROID_STREAM_API_MODE:-auto}
      LOG_LEVEL: ${LOG_LEVEL:-}
    # Linux でも host.docker.internal でホストの音声サーバに届くようにする
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - db:/app/db
      - files:/app/files
      - log:/app/log
      # その他の設定を変えるときは app-config.yml を作ってから有効にする
      # - ./app-config.yml:/app/app-config.yml:ro

volumes:
  db:
  files:
  log:
