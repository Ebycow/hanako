name: Node.js CI

on:
  push:
    branches: [master, slashbros]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Test with coverage
        run: npm test

      - name: Upload coverage
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t hanako .

      - name: Load runtime dependencies in the image
        run: >
          docker run --rm hanako node -e "
          const prism = require('prism-media');
          new prism.opus.Encoder({ rate: 48000, channels: 2, frameSize: 960 });
          require('@alexanderolsen/libsamplerate-js');
          require('@snazzah/davey');
          console.log('ffmpeg: ' + prism.FFmpeg.getInfo().command);"
