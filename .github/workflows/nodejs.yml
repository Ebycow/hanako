name: Node.js CI

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Test with coverage
        run: npm test

      - name: Upload coverage
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t hanako .

      - name: Load runtime dependencies in the image
        run: >
          docker run --rm hanako node -e "
          const prism = require('prism-media');
          new prism.opus.Encoder({ rate: 48000, channels: 2, frameSize: 960 });
          require('@alexanderolsen/libsamplerate-js');
          require('@snazzah/davey');
          console.log('ffmpeg: ' + prism.FFmpeg.getInfo().command);"

  # master に入ったら、テストとビルドが通ったイメージを GHCR に公開する
  # 本番の deploy.sh と、quickstart/compose.yaml はこのイメージを使う
  publish:
    needs: [lint-and-test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ebycow/hanako
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
